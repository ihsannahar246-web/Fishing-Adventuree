<div class=bb><button class=wb onclick="saveSet();toast($t('saved'))">${$t('save')}</button><button class=wb onclick="pRedeem()">REDEEM CODE</button><button class=wb onclick="ovx()">${$t('back')}</button></div>`)}
function setFS(on){try{Promise.resolve(on?document.documentElement.requestFullscreen():(document.fullscreenElement&&document.exitFullscreen())).catch(()=>{})}catch(e){}SET.fs=on;saveSet();setTimeout(pSet,350)}
function chLang(){SET.lang=SET.lang=='id'?'en':'id';saveSet();mainMenu();pSet()}
let NG={n:'',g:'f',L:defLook('f'),d:2};
const hd=g=>{const f=frameFor(g,'idle',2,0),hf=g=='m'?.6:.46,sc=Math.min(56/f.w,56/(f.h*hf));return mk(56,56,c=>{c.imageSmoothingEnabled=false;if(f.i.complete)c.drawImage(f.i,0,0,f.w,f.h*hf,(56-f.w*sc)/2,(56-f.h*hf*sc)/2,f.w*sc,f.h*hf*sc)}).toDataURL()};
function pNew(){NG={n:'',g:'f',L:defLook('f'),d:2};rNew()}
function setG(g){NG.g=g;NG.L=defLook(g);rNew()}
function cy(k,d){NG.L[k]=(NG.L[k]+d+CN[k])%CN[k];rNew()}
function rNew(){const rows=[['hair','h'],['hairc','hc'],['shirt','ss'],['shirtc','sc'],['pants','pc'],['acc','a']];
ovh(`<div class="wb pt">${$t('new')}</div><div class=pp>${orn()}<div class=cc><div class=cl><div>${$t('name')}</div><input id=nm class=inp maxlength=12 value="${esc(NG.n)}" placeholder="${$t('ph')}" oninput="NG.n=this.value">
<div>${$t('gender')}</div><div class=two style="margin:8px 0"><button class="wb gb ${NG.g=='m'?'sel':''}" onclick="setG('m')"><img src="${hd('m')}"><br>${$t('male')}</button><button class="wb gb ${NG.g=='f'?'sel':''}" onclick="setG('f')"><img src="${hd('f')}"><br>${$t('female')}</button></div>
${rows.map(r=>`<div class=ar><button class=wb onclick="cy('${r[1]}',-1)">◀</button><span>${$t(r[0])} ${OPT[r[1]]?'<i class=sw style="position:static;background:'+OPT[r[1]][NG.L[r[1]]]+'"></i>':NG.L[r[1]]+1}</span><button class=wb onclick="cy('${r[1]}',1)">▶</button></div>`).join('')}</div>
<div class=cr><canvas id=pv width=40 height=46></canvas><div class=three>${[['front',2],['side',1],['backv',0]].map(a=>`<button class="wb ${NG.d==a[1]?'on':''}" onclick="NG.d=${a[1]};rNew()">${$t(a[0])}</button>`).join('')}</div></div></div></div>
<div class=bb><button class=wb onclick="ovx()">${$t('back')}</button><button class=wb onclick="startNew()">${$t('start')}</button></div>`)}
function startNew(){const n=NG.n.trim().slice(0,12);if(!n){toast($t('needName'));return}const id='s'+Date.now();saves[id]=Object.assign(JSON.parse(JSON.stringify(DEF)),{name:n,gender:NG.g,look:NG.L,char:{id:NG.g=='m'?'male-01':'female-01',gender:NG.g,sprite:NG.g=='m'?'m1':'f1',look:NG.L},t:Date.now()});wr();begin(id)}
function pLoad(){const ks=Object.keys(saves).sort((a,b)=>saves[b].t-saves[a].t);
ovh(`<div class="wb pt">${$t('load')}</div><div class=pp>${orn()}${ks.length?ks.map(k=>{const s=saves[k];return `<div class=sv><span><b>${esc(s.name)}</b> Lv${s.lv} · 💰${s.co}<br><small>${new Date(s.t).toLocaleString(SET.lang)}</small></span><button class=wb onclick="begin('${k}')">${$t('play')}</button><button class=wb onclick="pDel('${k}')">${$t('del')}</button></div>`}).join(''):`<p style="text-align:center">${$t('empty')}</p>`}</div><div class=bb><button class=wb onclick="ovx()">${$t('back')}</button></div>`)}
function pDel(k){ovh(`<div class=pp style="text-align:center">${$t('delq')}<br><br><b>${esc(saves[k].name)}</b></div><div class=bb><button class=wb onclick="delS('${k}')">${$t('yes')}</button><button class=wb onclick="pLoad()">${$t('no')}</button></div>`)}
function delS(k){delete saves[k];wr();pLoad()}
function pExit(){ovh(`<div class=pp style="text-align:center">${$t('exitq')}</div><div class=bb><button class=wb onclick="byeM()">${$t('yes')}</button><button class=wb onclick="ovx()">${$t('no')}</button></div>`)}
function byeM(){try{window.close()}catch(e){}ovh(`<div class=pp style="text-align:center">${$t('bye')}</div><div class=bb><button class=wb onclick="ovx()">${$t('back')}</button></div>`)}
function pMenu(){show(`<h3>⏸ Menu</h3><p><button onclick="shut()">▶ Lanjutkan</button></p><p><button onclick="save();toast('Tersimpan');shut()">💾 Simpan</button></p><p><button onclick="pSet()">⚙️ Pengaturan</button></p><p><button onclick="pRedeem()">🎁 Redeem Code</button></p><p><button onclick="toMenu()">🏠 Menu Utama</button></p>`)}
